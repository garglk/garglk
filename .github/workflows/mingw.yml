name: MinGW

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Must match the container ubuntu-cross builds the assets in: the host
  # Qt in mingw-llvm-host-qt6 is native Linux and inherits that glibc.
  UBUNTU: "24.04"
  # llvm-mingw publishes only ubuntu-22.04 host tarballs; that is the
  # host build of LLVM and runs fine on newer Ubuntu.
  LLVM_MINGW: "20260616"
  LLVM_MINGW_HOST: "msvcrt-ubuntu-22.04-x86_64"
  # Sysroots come from a release rather than raw/master, so the tarballs
  # never enter the assets repo's git history.
  ASSET_RELEASE: "mingw-llvm-24.04"

jobs:
  build:
    strategy:
      matrix:
        arch:
          - i686
          - x86_64
          - aarch64
          - armv7

    runs-on: ubuntu-latest
    container:
      image: amd64/ubuntu:24.04
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update packages
        run: apt update

      - name: Install packages
        run: DEBIAN_FRONTEND=noninteractive apt install -y
          build-essential
          cmake
          dos2unix
          git
          libarchive-tools
          pkg-config
          nsis
          p7zip-full
          unzip
          wget
          zip

      - name: Set up MinGW environment
        run: |
          mkdir /usr/llvm-mingw
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW}/llvm-mingw-${LLVM_MINGW}-${LLVM_MINGW_HOST}.tar.xz
          bsdtar --strip-components 1 -x -v -f llvm-mingw-${LLVM_MINGW}-${LLVM_MINGW_HOST}.tar.xz -C /usr/llvm-mingw
          rm /usr/llvm-mingw/${{ matrix.arch }}-w64-mingw32/include
          cp -a /usr/llvm-mingw/generic-w64-mingw32/include /usr/llvm-mingw/${{ matrix.arch }}-w64-mingw32
          assets=https://github.com/garglk/assets/releases/download/${ASSET_RELEASE}
          wget ${assets}/mingw-llvm-${{ matrix.arch }}-${UBUNTU}.tar.xz
          bsdtar xf mingw-llvm-${{ matrix.arch }}-${UBUNTU}.tar.xz -C /usr/llvm-mingw
          wget ${assets}/mingw-llvm-host-qt6-${UBUNTU}.tar.xz
          bsdtar xf mingw-llvm-host-qt6-${UBUNTU}.tar.xz -C /usr/llvm-mingw
          mkdir NSIS
          cd NSIS
          wget https://nsis.sourceforge.io/mediawiki/images/7/78/FontName-0.7.zip
          unzip FontName-0.7.zip
          7z x -bb3 FontName-0.7.exe
          mkdir -p /usr/share/nsis/Include
          mkdir -p /usr/share/nsis/Plugins/x86-ansi
          for inc in Include/*; do iconv -f CP1251 -t UTF8 ${inc} -o /usr/share/nsis/Include/$(basename ${inc}); done
          cp Plugins/FontName.dll /usr/share/nsis/Plugins/x86-ansi
          cd ..

      - name: Build
        run: |
          echo $(date +"%Y%m%d").$(echo $GITHUB_SHA | cut -b 1-7) > VERSION
          ./windows.sh -a ${{ matrix.arch }}

      - name: Package
        run: ./package-windows.sh ${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Gargoyle-installer-${{ matrix.arch }}
          path: gargoyle-*.exe
        if: ${{ matrix.arch == 'i686' || matrix.arch == 'x86_64' }}

      - name: Upload standalone
        uses: actions/upload-artifact@v7
        with:
          name: Gargoyle-standalone-${{ matrix.arch }}
          path: gargoyle-*.zip
